<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stemacle — moved to stemacle.com</title>
<meta name="description" content="The Stemacle stem player now lives at stemacle.com.">
<!-- The player moved to its own domain. GitHub Pages cannot serve a 301, so
     the canonical tag is what consolidates ranking signals onto stemacle.com;
     the meta refresh and the script only move the human. -->
<link rel="canonical" href="https://stemacle.com/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://stemacle.com/">
<link rel="icon" type="image/png" href="/assets/stemacle-tentacle.png">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#f7f4ec;color:#181410;font-family:"Charter","Georgia",serif;font-size:17px;
line-height:1.6;text-align:center;padding:24px}
a{color:#6d1414}
</style>
</head>
<body>
<main>
<p><b>Stemacle</b> has moved to <a href="https://stemacle.com/">stemacle.com</a>.</p>
<p>If you are not redirected, follow the link above.</p>
</main>
<script>location.replace("https://stemacle.com/");</script>
</body>
</html>
