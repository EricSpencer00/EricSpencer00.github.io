name: Deploy to dev.ericspencer.us

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build index.html from content/*.txt
        run: python3 scripts/build.py
      - name: Build project route mirrors
        run: python3 scripts/build_project_routes.py
      - name: Build blog HTML from Markdown
        run: python3 scripts/build_blog.py
      - name: Build resume/CV landing pages
        run: |
          python3 scripts/build_research.py
          python3 scripts/build_resume_pages.py
      - name: Build the public project catalog
        run: python3 scripts/build_projects.py
      - name: Build legacy hub redirects
        run: python3 scripts/build_legacy_redirects.py
      - name: Build the public app directory
        run: python3 scripts/build_public_apps.py
      - name: Normalize canonical project headings
        run: python3 scripts/normalize_project_pages.py
      - name: Apply shared portfolio theme
        run: python3 scripts/apply_portfolio_theme.py
      - name: Apply the top nav
        run: python3 scripts/apply_nav.py
      - name: Drop the blog when nothing is published
        run: python3 scripts/prune_blog.py
      - name: Collapse the old Hugo URLs to redirects
        run: python3 scripts/collapse_mirrors.py
      - name: Check every project page has one copy
        run: python3 scripts/check_project_pages.py
      - name: Point pages at their link-preview cards
        run: python3 scripts/apply_og_tags.py
      - name: Apply search tags
        run: python3 scripts/seo_tags.py
      - name: Build the browser-only site assistant
        run: python3 scripts/build_chatbot_knowledge.py
      - name: Set up Node for homepage regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify routes and SEO metadata
        run: |
          python3 scripts/build_sitemap.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/check_site.py
          python3 scripts/build_social_cards.py --check
      # Run after every generator: checked-in project pages can already carry
      # the production tag even when the newly built homepage does not.
      - name: Remove analytics and enforce staging host/crawler rules
        run: |
          python3 scripts/prepare_staging.py
          python3 scripts/prepare_staging.py --check
      - name: Keep the copy review desk local
        run: rm -rf editor
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
      - name: Push to dev.EricSpencer00.github.io
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "dev.ericspencer.us" > CNAME
          # robots.txt lets crawlers fetch the page-level noindex directives.
          git add -A CNAME index.html news blog robots.txt cv resume assets editor \
            miscellaneous research research.html projects.html apps 404.html projects sitemap.xml \
            1rm stem-player ulam-spiral ulam-spiral-b12
          # Carry the guarded collector workflow into the generated mirror.
          git add .github/workflows/signals.yml
          git commit --allow-empty -m "chore: build + set dev CNAME"
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote add dev-site git@github.com:EricSpencer00/dev.EricSpencer00.github.io.git
          git push dev-site HEAD:main --force
