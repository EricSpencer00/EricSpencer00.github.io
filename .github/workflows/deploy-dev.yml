name: Deploy to dev.ericspencer.us

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build index.html from content/*.txt
        run: python3 scripts/build.py
      - name: Build blog HTML from Markdown
        run: python3 scripts/build_blog.py
      - name: Build resume/CV landing pages
        run: python3 scripts/build_resume_pages.py
      - name: Apply the top nav
        run: python3 scripts/apply_nav.py
      - name: Drop the blog when nothing is published
        run: python3 scripts/prune_blog.py
      - name: Collapse the old Hugo URLs to redirects
        run: python3 scripts/collapse_mirrors.py
      - name: Check every project page has one copy
        run: python3 scripts/check_project_pages.py
      - name: Point pages at their link-preview cards
        run: python3 scripts/apply_og_tags.py
      - name: Apply search tags
        run: python3 scripts/seo_tags.py
      - name: Build the browser-only site assistant
        run: python3 scripts/build_chatbot_knowledge.py
      - name: Keep development pages out of search
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'backup-site', 'editor', 'tests'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              if '</head>' not in text:
                  continue
              text = re.sub(
                  r'<meta name="robots" content="[^"]*">',
                  '<meta name="robots" content="noindex, follow">',
                  text,
              )
              path.write_text(text, encoding='utf-8')
          PY
      - name: Keep the copy review desk local
        run: rm -rf editor
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
      - name: Push to dev.EricSpencer00.github.io
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "dev.ericspencer.us" > CNAME
          # Crawlers must be able to fetch development pages to see their
          # noindex directives and production canonical URLs.
          printf 'User-agent: *\nAllow: /\n' > robots.txt
          git add -A CNAME index.html blog robots.txt cv resume assets editor \
            research.html projects.html 404.html projects
          git commit --allow-empty -m "chore: build + set dev CNAME"
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote add dev-site git@github.com:EricSpencer00/dev.EricSpencer00.github.io.git
          git push dev-site HEAD:main --force
