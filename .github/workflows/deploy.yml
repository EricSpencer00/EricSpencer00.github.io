name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static pages
        run: |
          python3 scripts/build.py
          python3 scripts/build_blog.py
          python3 scripts/build_resume_pages.py

      # backup-site/ is an archive of the old Hugo site kept in git for
      # reference. Shipping it published ~30 duplicate pages — including a
      # second copy of the homepage at /backup-site/ — which competed with the
      # real site in search. Keep it in the repo, keep it off the web.
      - name: Strip non-published directories from the artifact
        run: rm -rf backup-site

      - name: Upload Artifact for Deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-to-gh-pages:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
