name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # build_sitemap.py dates each entry from its last commit. A shallow
          # clone would stamp every page with the same day and tell crawlers
          # nothing about what actually changed.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static pages
        run: |
          python3 scripts/build.py
          python3 scripts/build_blog.py
          python3 scripts/build_resume_pages.py

      # One definition of the top nav for every page, so `cv` cannot reach only
      # the homepage again and `blog` only appears once something is published.
      - name: Apply the top nav
        run: python3 scripts/apply_nav.py

      # Before the sitemap: an unpublished blog should not be listed in it.
      - name: Drop the blog when nothing is published
        run: python3 scripts/prune_blog.py

      # The old Hugo URLs (/projects/<year>/<slug>/, /miscellaneous/<slug>/) are
      # kept as redirect stubs, not second copies of the page. Runs every build
      # so a newly added project cannot quietly ship a duplicate again. Before
      # apply_og_tags.py, which has to reapply the card tags to the new stub.
      - name: Collapse the old Hugo URLs to redirects
        run: python3 scripts/collapse_mirrors.py

      # collapse_mirrors.py reads each mirror's own canonical tag, so a mirror
      # without one is skipped and keeps serving a second copy of the writeup.
      # content/project-pages.txt says which mirror belongs to which page; this
      # fails the build when the files disagree with it.
      - name: Check every project page has one copy
        run: python3 scripts/check_project_pages.py

      # Runs last: the generators above rewrite whole <head> blocks, so the
      # link-preview tags have to be reapplied after them or every rebuild
      # silently drops each page back to a generic card. The card images
      # themselves are committed -- regenerating those needs Chrome and is a
      # local step (scripts/build_og_images.py).
      - name: Point pages at their link-preview cards
        run: python3 scripts/apply_og_tags.py

      # Also last, and for the same reason: favicon links, robots directives and
      # the structured-data image live in the same <head> the generators rewrite.
      - name: Apply search tags
        run: python3 scripts/seo_tags.py

      # Read the completed public site into a static retrieval index and attach
      # the browser-only assistant to every public page.
      - name: Build the browser-only site assistant
        run: python3 scripts/build_chatbot_knowledge.py

      # Reads the finished pages, so it runs after everything that writes them.
      - name: Build sitemap
        run: python3 scripts/build_sitemap.py

      # backup-site/ is an archive of the old Hugo site kept in git for
      # reference. Shipping it published ~30 duplicate pages — including a
      # second copy of the homepage at /backup-site/ — which competed with the
      # real site in search. Keep it in the repo, keep it off the web. tests/
      # is the same deal: harnesses that drive a page in an iframe, not pages.
      - name: Strip non-published directories from the artifact
        run: rm -rf backup-site tests

      - name: Upload Artifact for Deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-to-gh-pages:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
