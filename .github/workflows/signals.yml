name: Collect repository traffic

# GitHub keeps only 14 days of traffic and /traffic/views needs push access, so
# the browser cannot ask for it. This snapshots the numbers nightly, accumulates
# them past the window GitHub retains, and commits the rollup the homepage reads.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot traffic
        env:
          # A PAT with `repo` scope. The built-in GITHUB_TOKEN can only read
          # traffic for this repository, which would leave every other row
          # falling back to stars.
          GITHUB_TOKEN: ${{ secrets.SIGNALS_TOKEN }}
          SIGNALS_OWNERS: EricSpencer00,LUC-AI4FM
        run: python3 scripts/collect_signals.py

      - name: Commit the rollup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/signals.json assets/data/signals-history.json
          git diff --staged --quiet || git commit -m "chore: refresh repository traffic signals"
          git push
